{% extends "base.html" %}
{% block title %}비밀번호 찾기{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h2>비밀번호 찾기</h2>
  <p class="muted">가입 시 등록한 아이디를 입력하세요.</p>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <label for="username">아이디</label>
    {{ form.username(id="username", autocomplete="username") }}
    {% for e in form.username.errors %}<div class="errors">{{ e }}</div>{% endfor %}

    <button class="btn" type="submit">다음</button>
  </form>
  <p class="muted" style="margin-top:14px;"><a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a></p>
</div>
{% endblock %}
